<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Weather App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-500 to-indigo-70 flex flex-col items-center justify-center p-6 text-white font-sans">

    <!-- Search Box -->
    <div class="mb-8 w-full max-w-md flex gap-2">
        <input type="text" id="cityInput" placeholder="Enter city name..." class="w-full px-4 py-2 rounded-lg text-gray-80 focus:outline-none shadow-md">
        <button id="searchBtn" class="bg-amber-500 hover:bg-amber-600 px-6 py-2 rounded-lg font-bold shadow-md transition">Search</button>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="hidden bg-red-500 text-white px-4 py-2 rounded-lg shadow-md mb-4"></div>

    <!-- Current Weather Card -->
    <div id="weatherCard" class="hidden bg-white/20 backdrop-blur-md p-6 rounded-2xl shadow-xl w-full max-w-md text-center border border-white/30">
        <h2 id="cityName" class="text-3xl font-bold">---</h2>
        <div class="flex justify-center items-center my-2">
            <img id="weatherIcon" src="" alt="icon">
            <span id="temperature" class="text-5xl font-extrabold">--°C</span>
        </div>
        <p id="description" class="capitalize text-lg font-light tracking-wide">---</p>
        
        <div class="flex justify-between mt-6 pt-4 border-t border-white/20 text-sm">
            <div>
                <p class="opacity-70">Humidity</p>
                <p id="humidity" class="font-semibold text-lg">--%</p>
            </div>
            <div>
                <p class="opacity-70">Wind Speed</p>
                <p id="windSpeed" class="font-semibold text-lg">-- m/s</p>
            </div>
        </div>
    </div>

    <!-- 5-Day Forecast -->
    <div id="forecastContainer" class="hidden mt-8 w-full max-w-4xl">
        <h3 class="text-xl font-semibold mb-4 text-center">5-Day Forecast</h3>
        <div id="forecastGrid" class="grid grid-cols-2 sm:grid-cols-5 gap-4">
            <!-- Forecast cards JS se generate honge -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
